# pytest.ini
#
# Configuration file for the pytest test runner.
#
# This file registers custom markers so pytest does not emit warnings when
# tests use @pytest.mark.e2e.  It also sets sensible defaults for the test run.
#
# To run only the unit tests (no real PyArmor / PyInstaller required):
#   pytest -m "not e2e" -v
#
# To run only the end-to-end tests (PyArmor and PyInstaller must be installed):
#   pytest -m e2e -v
#
# To run all tests:
#   pytest -v

[pytest]

# Register custom markers to avoid "PytestUnknownMarkWarning" warnings.
# Each marker is listed as: marker_name: description
markers =
    e2e: End-to-end tests that require real PyArmor and PyInstaller. Mark tests with @pytest.mark.e2e.

# Default options applied to every pytest run.
# --tb=short prints compact tracebacks, which are easier to hear on a screen reader.
addopts = --tb=short
